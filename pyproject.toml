[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "world-holobridge"
version = "0.1.0"
description = "Reference prototype of a consent, cultural-authority, payment and accessibility governance workflow for community media projects (SQLite, standard library only)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Jean-François Brisson" }]
keywords = ["governance", "consent", "data-governance", "accessibility", "digital-humanities", "sqlite", "audit-log"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/sparkainlp-x/world-holobridge"
Issues = "https://github.com/sparkainlp-x/world-holobridge/issues"

[project.scripts]
world-holobridge = "world_holobridge:main"

[tool.setuptools]
py-modules = ["world_holobridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
