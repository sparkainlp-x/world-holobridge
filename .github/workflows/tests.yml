name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      REQUIRE_NODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install .
      - name: Python tests (including Python/JS parity)
        run: python -m pytest -q
      - name: JavaScript tests
        run: node --test tests/js/plan.test.js
      - name: Demo end to end
        run: python world_holobridge.py --db ":memory:" --output-dir "$RUNNER_TEMP/holobridge-output"
      - name: Installed CLI generates a plan outside the checkout
        working-directory: ${{ runner.temp }}
        run: world-holobridge plan --city "Fredericton" --region "New Brunswick" --country "Canada" --language fr --run-pipeline --output-dir "$RUNNER_TEMP/plan-reports" > plan.md && grep -q "Fredericton" plan.md
